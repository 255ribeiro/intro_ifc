site_name: Introdução ao IFC
use_directory_urls: false

copyright: Copyright &copy; 2025 Fernando Ribeiro - Bruno Leão

theme:
  features:
    #- navigation.sections
    - toc.integrate
    #- navigation.tabs
  name: material
  language: en-custom
  custom_dir: docs\overrides
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: orange
      accent: deep orange
      toggle:
        icon: material/toggle-switch-off-outline
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: orange
      accent: deep orange
      toggle:
        icon: material/toggle-switch
        name: Switch to light mode

site_url: "https://255ribeiro.github.io/intro_ifc/"
repo_url: "https://github.com/255ribeiro/intro_ifc/"
repo_name: "255ribeiro/intro_ifc"

nav:
  - Home: index.md
  - Instalação das ferramentas:
      - Bonsai BIM: ./install_tools/bonsai_install/bonsai_install.md
      - project libre: ./install_tools/project_libre_install/pl_install.md
      - BimCollab: ./install_tools/bimcollab_install/bimcollab_install.md
      - Visualizadores de IFC:
          - Ifc Open Viewer: ./install_tools/open_ifc_viewer_install/open_ifc_viewer.md
          - DDS Cad Viewer: ./install_tools/dds_cad_install/dds_cad_install.md
          - KIT Tools: ./install_tools/kit_tools_install/kit_tools_install.md

  - Exportação IFC:
      - Revit:
          - IFC:
              - Atualizar exportador IFC do Revit: ./exportacao/Revit/IFC/revit_IFC_install.md
              - Dados do projeto: ./exportacao/Revit/IFC/ifc_project_data.md
              - Configuração básica do exportador IFC do Revit: ./exportacao/Revit/IFC/Revit_2024_config_basica/config_exporter.md
          - Informações e parâmetros:
              - Organizando as pastas do projeto: ./exportacao/Revit/projeto_revit/projeto.md
              - Informações do Projeto: ./exportacao/Revit/project_info.md
              - Planilhas: ./exportacao/Revit/planilhas/planilhas.md
              - Tipos de parâmetros: ./exportacao/Revit/parametros.md
              - Parâmetros de familia: ./exportacao/Revit/param_de_familia.md
              - Parâmetros compartilhados: ./exportacao/Revit/shared_param/shared_param.md
          - Georreferenciamento: ./exportacao/Revit/georref/georref.md
      - Archicad:
          - IFC: ./exportacao/Archicad/archicad_ifc.md
  - IFC:
    - Introdução: ./IFC/ifc_intro.md
    - IfcWall: ./IFC/IfcWall/IfcWall.md
    - IfcCovering: ./IFC/ifcCovering/IfcCovering.md
  - IDS:
    - IDS Editor Online: ./IDS/ids_editor.md

  - Exemplos: ./exemplos/exemplos.md
  - Exercícios:
    - Exercício 01: ./BCF/exercicio.md

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - attr_list
  - toc:
      toc_depth: 1

extra_css:
  - overrides/css/extra_css.css

plugins:
  - mkdocs-jupyter
