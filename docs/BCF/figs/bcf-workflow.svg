  <rect x="20" y="44" width="150" height="212" rx="5" fill="#1e2333" stroke="#374151" stroke-width="1"/>
  <text x="95" y="64" text-anchor="middle" fill="#64748b" font-size="9" font-weight="bold" font-family="monospace">DETECCAO</text>

  <rect x="32" y="74" width="126" height="34" rx="3" fill="#0f2035" stroke="#60a5fa" stroke-width="1"/>
  <text x="95" y="96" text-anchor="middle" fill="#93c5fd" font-size="9" font-family="sans-serif">Navisworks / Solibri</text>

  <rect x="32" y="116" width="126" height="34" rx="3" fill="#0a1f14" stroke="#34d399" stroke-width="1"/>
  <text x="95" y="138" text-anchor="middle" fill="#6ee7b7" font-size="9" font-family="sans-serif">BonsaiBIM / IfcClash</text>

  <rect x="32" y="158" width="126" height="34" rx="3" fill="#0f2035" stroke="#60a5fa" stroke-width="1"/>
  <text x="95" y="180" text-anchor="middle" fill="#93c5fd" font-size="9" font-family="sans-serif">BIMcollab Zoom</text>

  <rect x="32" y="200" width="126" height="34" rx="3" fill="#0f2035" stroke="#60a5fa" stroke-width="1"/>
  <text x="95" y="222" text-anchor="middle" fill="#93c5fd" font-size="9" font-family="sans-serif">ACC Model Coord.</text>

  <!-- Arrow out from detection -->
  <line x1="170" y1="150" x2="226" y2="150" stroke="#f0b429" stroke-width="2"/>
  <polygon points="226,150 217,144 217,156" fill="#f0b429"/>
  <text x="198" y="143" text-anchor="middle" fill="#f0b429" font-size="8" font-family="monospace">exporta</text>
  <text x="198" y="155" text-anchor="middle" fill="#f0b429" font-size="8" font-family="monospace">.bcf</text>

  <!-- Central BCF file -->
  <rect x="226" y="104" width="140" height="92" rx="6" fill="#2d2010" stroke="#f0b429" stroke-width="2"/>
  <text x="296" y="138" text-anchor="middle" fill="#fcd34d" font-size="13" font-weight="bold" font-family="monospace">BCF</text>
  <text x="296" y="156" text-anchor="middle" fill="#fbbf24" font-size="9" font-family="monospace">.bcfzip</text>
  <text x="296" y="172" text-anchor="middle" fill="#64748b" font-size="8" font-family="sans-serif">v2.1 / v3.0</text>
  <text x="296" y="186" text-anchor="middle" fill="#64748b" font-size="8" font-family="monospace">XML + PNG</text>

  <!-- Arrow out to authoring -->
  <line x1="366" y1="120" x2="420" y2="100" stroke="#4b5563" stroke-width="1.5"/>
  <polygon points="420,100 410,96 412,108" fill="#4b5563"/>
  <text x="395" y="105" text-anchor="middle" fill="#4b5563" font-size="8" font-family="monospace">importa</text>

  <!-- Arrow out to issue mgmt -->
  <line x1="366" y1="180" x2="420" y2="196" stroke="#4b5563" stroke-width="1.5"/>
  <polygon points="420,196 409,190 413,202" fill="#4b5563"/>
  <text x="395" y="200" text-anchor="middle" fill="#4b5563" font-size="8" font-family="monospace">importa</text>

