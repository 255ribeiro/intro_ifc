<svg viewBox="0 0 720 280" width="720" height="280" xmlns="http://www.w3.org/2000/svg">
  <rect width="720" height="280" rx="8" fill="#1a1f2e"/>
  <text x="360" y="24" text-anchor="middle" fill="#e2e8f0" font-size="12" font-weight="bold" font-family="sans-serif">Fluxo BCF entre ferramentas</text>

