  <line x1="420" y1="116" x2="366" y2="130" stroke="#4b5563" stroke-width="1.2" stroke-dasharray="4,3"/>
  <polygon points="366,130 373,122 376,133" fill="#4b5563"/>
  <text x="393" y="132" text-anchor="middle" fill="#4b5563" font-size="7" font-family="monospace">atualiza</text>

