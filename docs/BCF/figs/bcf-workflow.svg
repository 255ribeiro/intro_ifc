  <rect x="564" y="74" width="124" height="34" rx="3" fill="#0a1f14" stroke="#34d399" stroke-width="1"/>
  <text x="626" y="87" text-anchor="middle" fill="#6ee7b7" font-size="9" font-family="sans-serif">BonsaiBIM</text>
  <text x="626" y="100" text-anchor="middle" fill="#34d399" font-size="8" font-family="monospace">Open Source</text>

  <rect x="432" y="114" width="256" height="28" rx="3" fill="#1e1a0a" stroke="#fbbf24" stroke-width="1"/>
  <text x="560" y="132" text-anchor="middle" fill="#fcd34d" font-size="8" font-family="sans-serif">Navega ao viewpoint e corrige o modelo IFC</text>

  <!-- Right bottom: Issue mgmt -->
  <rect x="420" y="168" width="280" height="112" rx="5" fill="#1e2333" stroke="#374151" stroke-width="1"/>
  <text x="560" y="188" text-anchor="middle" fill="#64748b" font-size="9" font-weight="bold" font-family="monospace">GESTAO DE ISSUES</text>

  <rect x="432" y="198" width="78" height="34" rx="3" fill="#0f2035" stroke="#60a5fa" stroke-width="1"/>
  <text x="471" y="220" text-anchor="middle" fill="#93c5fd" font-size="8" font-family="sans-serif">BIMcollab</text>

  <rect x="516" y="198" width="78" height="34" rx="3" fill="#0f2035" stroke="#60a5fa" stroke-width="1"/>
  <text x="555" y="220" text-anchor="middle" fill="#93c5fd" font-size="8" font-family="sans-serif">ACC Issues</text>

  <rect x="600" y="198" width="88" height="34" rx="3" fill="#0a1f14" stroke="#34d399" stroke-width="1"/>
  <text x="644" y="211" text-anchor="middle" fill="#6ee7b7" font-size="8" font-family="sans-serif">BonsaiBIM</text>
  <text x="644" y="224" text-anchor="middle" fill="#34d399" font-size="7" font-family="monospace">BCF Panel</text>

  <rect x="432" y="240" width="256" height="28" rx="3" fill="#0a1828" stroke="#60a5fa" stroke-width="1"/>
  <text x="560" y="258" text-anchor="middle" fill="#7dd3fc" font-size="8" font-family="sans-serif">Atribuicao, status, comentarios, prazo por issue</text>
</svg>
