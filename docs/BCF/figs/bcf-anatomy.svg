<svg viewBox="0 0 700 320" width="700" height="320" xmlns="http://www.w3.org/2000/svg">
  <rect width="700" height="320" rx="8" fill="#1a1f2e"/>

  <!-- Title -->
  <text x="350" y="26" text-anchor="middle" fill="#e2e8f0" font-size="13" font-weight="bold" font-family="sans-serif">Anatomia de um arquivo BCF</text>
  <text x="350" y="42" text-anchor="middle" fill="#4b5563" font-size="9" font-family="monospace">.bcfzip  =  arquivo ZIP contendo topics em XML + snapshots em PNG</text>

  <!-- Outer BCF file box -->
  <rect x="20" y="54" width="660" height="248" rx="6" fill="#1e2333" stroke="#f0b429" stroke-width="2"/>
  <rect x="20" y="54" width="660" height="32" rx="6" fill="#2d2010"/>
  <rect x="20" y="74" width="660" height="12" fill="#2d2010"/>
  <text x="350" y="75" text-anchor="middle" fill="#fcd34d" font-size="11" font-weight="bold" font-family="monospace">arquivo.bcfzip</text>

  <!-- Topic box -->
  <rect x="40" y="98" width="620" height="192" rx="5" fill="#161b27" stroke="#60a5fa" stroke-width="1.5"/>
  <rect x="40" y="98" width="620" height="26" rx="5" fill="#0f2035"/>
  <rect x="40" y="112" width="620" height="12" fill="#0f2035"/>
  <text x="350" y="116" text-anchor="middle" fill="#93c5fd" font-size="10" font-weight="bold" font-family="monospace">topic.bcf  (pode haver N topics)</text>

  <!-- 4 inner components -->
  <!-- Viewpoint -->
  <rect x="56" y="136" width="140" height="140" rx="4" fill="#0a1828" stroke="#818cf8" stroke-width="1.2"/>
  <rect x="56" y="136" width="140" height="24" rx="4" fill="#1e1b4b"/>
  <rect x="56" y="148" width="140" height="12" fill="#1e1b4b"/>
  <text x="126" y="152" text-anchor="middle" fill="#a5b4fc" font-size="9" font-weight="bold" font-family="monospace">VIEWPOINT</text>
  <!-- camera icon -->
  <rect x="88" y="170" width="52" height="34" rx="3" fill="#2d2f52" stroke="#818cf8" stroke-width="1"/>
  <polygon points="140,177 155,170 155,191 140,184" fill="#818cf8" opacity="0.7"/>
  <circle cx="114" cy="187" r="8" fill="none" stroke="#818cf8" stroke-width="1.5"/>
  <text x="126" y="222" text-anchor="middle" fill="#94a3b8" font-size="8" font-family="sans-serif">Camera 3D</text>
  <text x="126" y="234" text-anchor="middle" fill="#94a3b8" font-size="8" font-family="sans-serif">posicionada no</text>
  <text x="126" y="246" text-anchor="middle" fill="#94a3b8" font-size="8" font-family="sans-serif">issue</text>
  <text x="126" y="262" text-anchor="middle" fill="#4b5563" font-size="7" font-family="monospace">viewpoint.bcfv</text>

  <!-- Snapshot -->
  <rect x="212" y="136" width="140" height="140" rx="4" fill="#0a1828" stroke="#34d399" stroke-width="1.2"/>
  <rect x="212" y="136" width="140" height="24" rx="4" fill="#0a1f14"/>
  <rect x="212" y="148" width="140" height="12" fill="#0a1f14"/>
  <text x="282" y="152" text-anchor="middle" fill="#6ee7b7" font-size="9" font-weight="bold" font-family="monospace">SNAPSHOT</text>
  <!-- image icon -->
  <rect x="244" y="170" width="76" height="48" rx="3" fill="#0f2f1e" stroke="#34d399" stroke-width="1"/>
  <rect x="244" y="188" width="76" height="30" rx="0" fill="#1a3d2a" opacity="0.8"/>
  <circle cx="262" cy="180" r="6" fill="#34d399" opacity="0.5"/>
  <text x="282" y="234" text-anchor="middle" fill="#94a3b8" font-size="8" font-family="sans-serif">Print do modelo</text>
  <text x="282" y="246" text-anchor="middle" fill="#94a3b8" font-size="8" font-family="sans-serif">na posicao do</text>
  <text x="282" y="258" text-anchor="middle" fill="#94a3b8" font-size="8" font-family="sans-serif">issue</text>
  <text x="282" y="268" text-anchor="middle" fill="#4b5563" font-size="7" font-family="monospace">snapshot.png</text>

  <!-- Components -->
  <rect x="368" y="136" width="140" height="140" rx="4" fill="#0a1828" stroke="#f87171" stroke-width="1.2"/>
  <rect x="368" y="136" width="140" height="24" rx="4" fill="#2d1515"/>
  <rect x="368" y="148" width="140" height="12" fill="#2d1515"/>
  <text x="438" y="152" text-anchor="middle" fill="#fca5a5" font-size="9" font-weight="bold" font-family="monospace">COMPONENTES</text>
  <text x="438" y="180" text-anchor="middle" fill="#94a3b8" font-size="8" font-family="sans-serif">GUIDs dos</text>
  <text x="438" y="193" text-anchor="middle" fill="#94a3b8" font-size="8" font-family="sans-serif">elementos IFC</text>
  <text x="438" y="206" text-anchor="middle" fill="#94a3b8" font-size="8" font-family="sans-serif">envolvidos</text>
  <text x="438" y="226" text-anchor="middle" fill="#4b5563" font-size="7" font-family="monospace">3KwGIlA2j...</text>
  <text x="438" y="238" text-anchor="middle" fill="#4b5563" font-size="7" font-family="monospace">0wLHqXb9k...</text>
  <text x="438" y="250" text-anchor="middle" fill="#4b5563" font-size="7" font-family="monospace">2mJPaTvEs...</text>

  <!-- Metadata -->
  <rect x="524" y="136" width="120" height="140" rx="4" fill="#0a1828" stroke="#fbbf24" stroke-width="1.2"/>
  <rect x="524" y="136" width="120" height="24" rx="4" fill="#1e1a0a"/>
  <rect x="524" y="148" width="120" height="12" fill="#1e1a0a"/>
  <text x="584" y="152" text-anchor="middle" fill="#fcd34d" font-size="9" font-weight="bold" font-family="monospace">METADATA</text>
  <text x="584" y="172" text-anchor="middle" fill="#94a3b8" font-size="7.5" font-family="sans-serif">Titulo</text>
  <text x="584" y="185" text-anchor="middle" fill="#94a3b8" font-size="7.5" font-family="sans-serif">Descricao</text>
  <text x="584" y="198" text-anchor="middle" fill="#94a3b8" font-size="7.5" font-family="sans-serif">Status</text>
  <text x="584" y="211" text-anchor="middle" fill="#94a3b8" font-size="7.5" font-family="sans-serif">Prioridade</text>
  <text x="584" y="224" text-anchor="middle" fill="#94a3b8" font-size="7.5" font-family="sans-serif">Responsavel</text>
  <text x="584" y="237" text-anchor="middle" fill="#94a3b8" font-size="7.5" font-family="sans-serif">Data limite</text>
  <text x="584" y="250" text-anchor="middle" fill="#94a3b8" font-size="7.5" font-family="sans-serif">Comentarios</text>
  <text x="584" y="263" text-anchor="middle" fill="#94a3b8" font-size="7.5" font-family="sans-serif">Labels</text>
</svg>
