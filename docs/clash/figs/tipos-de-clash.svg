<svg viewBox="0 0 740 290" width="740" height="290" xmlns="http://www.w3.org/2000/svg">
  <rect width="740" height="290" rx="8" fill="#1a1f2e"/>

  <!-- HARD CLASH card -->
  <rect x="20" y="16" width="220" height="258" rx="6" fill="#2d1515" stroke="#f87171" stroke-width="1.5"/>
  <rect x="20" y="16" width="220" height="40" rx="6" fill="#7f1d1d"/>
  <rect x="20" y="44" width="220" height="12" fill="#7f1d1d"/>
  <text x="130" y="41" text-anchor="middle" fill="#fecaca" font-size="13" font-weight="bold" font-family="monospace">HARD CLASH</text>

  <!-- icon: two overlapping rects -->
  <rect x="62" y="72" width="64" height="36" rx="3" fill="#f87171"/>
  <rect x="94" y="86" width="64" height="36" rx="3" fill="#60a5fa"/>
  <rect x="94" y="86" width="32" height="22" rx="2" fill="#fbbf24"/>

  <text x="130" y="148" text-anchor="middle" fill="#fca5a5" font-size="11" font-weight="bold" font-family="sans-serif">Intersecao fisica</text>
  <text x="130" y="165" text-anchor="middle" fill="#e2e8f0" font-size="10" font-family="sans-serif">Dois elementos ocupam</text>
  <text x="130" y="180" text-anchor="middle" fill="#e2e8f0" font-size="10" font-family="sans-serif">o mesmo espaco</text>
  <text x="130" y="204" text-anchor="middle" fill="#94a3b8" font-size="9" font-family="sans-serif">Ex: duto cortando</text>
  <text x="130" y="217" text-anchor="middle" fill="#94a3b8" font-size="9" font-family="sans-serif">viga estrutural</text>

  <rect x="46" y="240" width="148" height="22" rx="4" fill="#7f1d1d"/>
  <text x="120" y="255" text-anchor="middle" fill="#fca5a5" font-size="10" font-weight="bold" font-family="sans-serif">Prioridade CRITICA</text>

  <!-- SOFT CLASH card -->
  <rect x="260" y="16" width="220" height="258" rx="6" fill="#0f2035" stroke="#60a5fa" stroke-width="1.5"/>
  <rect x="260" y="16" width="220" height="40" rx="6" fill="#1e3a5f"/>
  <rect x="260" y="44" width="220" height="12" fill="#1e3a5f"/>
  <text x="370" y="41" text-anchor="middle" fill="#bfdbfe" font-size="13" font-weight="bold" font-family="monospace">SOFT CLASH</text>

  <!-- icon: two rects with gap zone -->
  <rect x="278" y="72" width="60" height="36" rx="3" fill="#f87171"/>
  <rect x="382" y="72" width="60" height="36" rx="3" fill="#34d399"/>
  <rect x="338" y="72" width="44" height="36" fill="#fbbf24" opacity="0.25"/>
  <line x1="338" y1="72" x2="338" y2="108" stroke="#fbbf24" stroke-width="1.5"/>
  <line x1="382" y1="72" x2="382" y2="108" stroke="#fbbf24" stroke-width="1.5"/>
  <text x="360" y="95" text-anchor="middle" fill="#fbbf24" font-size="8" font-family="monospace">gap</text>

  <text x="370" y="148" text-anchor="middle" fill="#93c5fd" font-size="11" font-weight="bold" font-family="sans-serif">Folga insuficiente</text>
  <text x="370" y="165" text-anchor="middle" fill="#e2e8f0" font-size="10" font-family="sans-serif">Nao se tocam mas</text>
  <text x="370" y="180" text-anchor="middle" fill="#e2e8f0" font-size="10" font-family="sans-serif">violam a tolerancia</text>
  <text x="370" y="204" text-anchor="middle" fill="#94a3b8" font-size="9" font-family="sans-serif">Ex: tubo sem folga</text>
  <text x="370" y="217" text-anchor="middle" fill="#94a3b8" font-size="9" font-family="sans-serif">para manutencao</text>

  <rect x="284" y="240" width="172" height="22" rx="4" fill="#1e3a5f"/>
  <text x="370" y="255" text-anchor="middle" fill="#93c5fd" font-size="10" font-weight="bold" font-family="sans-serif">Prioridade MODERADA</text>

  <!-- WORKFLOW CLASH card -->
  <rect x="500" y="16" width="220" height="258" rx="6" fill="#0f1f10" stroke="#34d399" stroke-width="1.5"/>
  <rect x="500" y="16" width="220" height="40" rx="6" fill="#14532d"/>
  <rect x="500" y="44" width="220" height="12" fill="#14532d"/>
  <text x="610" y="41" text-anchor="middle" fill="#bbf7d0" font-size="13" font-weight="bold" font-family="monospace">WORKFLOW CLASH</text>

  <!-- icon: two time-blocks overlapping -->
  <rect x="528" y="72" width="58" height="36" rx="3" fill="#f87171" opacity="0.9"/>
  <text x="557" y="87" text-anchor="middle" fill="white" font-size="8" font-family="sans-serif">Trade A</text>
  <text x="557" y="100" text-anchor="middle" fill="white" font-size="8" font-family="sans-serif">Sem. 3</text>
  <rect x="562" y="80" width="58" height="36" rx="3" fill="#60a5fa" opacity="0.9"/>
  <text x="591" y="95" text-anchor="middle" fill="white" font-size="8" font-family="sans-serif">Trade B</text>
  <text x="591" y="108" text-anchor="middle" fill="white" font-size="8" font-family="sans-serif">Sem. 3</text>
  <circle cx="562" cy="80" r="9" fill="#fbbf24"/>
  <text x="562" y="84" text-anchor="middle" fill="#1a1f2e" font-size="11" font-weight="bold" font-family="sans-serif">!</text>

  <text x="610" y="148" text-anchor="middle" fill="#6ee7b7" font-size="11" font-weight="bold" font-family="sans-serif">Conflito de sequencia</text>
  <text x="610" y="165" text-anchor="middle" fill="#e2e8f0" font-size="10" font-family="sans-serif">Duas atividades na</text>
  <text x="610" y="180" text-anchor="middle" fill="#e2e8f0" font-size="10" font-family="sans-serif">mesma area e tempo</text>
  <text x="610" y="204" text-anchor="middle" fill="#94a3b8" font-size="9" font-family="sans-serif">Ex: duas equipes</text>
  <text x="610" y="217" text-anchor="middle" fill="#94a3b8" font-size="9" font-family="sans-serif">na mesma semana</text>

  <rect x="520" y="240" width="180" height="22" rx="4" fill="#14532d"/>
  <text x="610" y="255" text-anchor="middle" fill="#6ee7b7" font-size="10" font-weight="bold" font-family="sans-serif">Prioridade PLANEJAMENTO</text>
</svg>
