[workspace]
authors = ["Fernando Ferraz Ribeiro <ffribeiro@gmail.com>"]
channels = ["conda-forge"]
name = "intro_ifc"
platforms = [
            "win-64", 
            "linux-64", 
            "osx-64", 
            "osx-arm64",
                ]

version = "0.1.0"

[tasks]
srvdoc = "zensical serve"
blddoc = "zensical gh-deploy"

[target.win-64.tasks]
link-bonsai   = 'cmd /c mklink /J bonsai "%appdata%\\Blender Foundation\\Blender\\5.0\\extensions\\blender_org\\bonsai"'
unlink-bonsai = "cmd /c rmdir bonsai"

[dependencies]
ipykernel = ">=6.29.5,<7"
zensical = ">=0.0.31,<0.0.32"
ifcopenshell = "==0.8.4"
lark = ">=1.1"
